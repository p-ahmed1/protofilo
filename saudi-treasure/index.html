<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇸🇦 كنز السعودية</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma,sans-serif;
    background:#f4f7ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:700px;
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
    color:#2563eb;
    margin-bottom:20px;
}

.score{
    background:#2563eb;
    color:white;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
    font-size:20px;
}

.danger{
    background:#dc2626 !important;
}

#question{
    margin:20px 0;
    font-size:24px;
}

.btn{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:12px;
    background:#eef4ff;
    cursor:pointer;
    font-size:18px;
}

.btn:hover{
    background:#2563eb;
    color:white;
}

.correct{
    background:#16a34a !important;
    color:white;
}

.wrong{
    background:#dc2626 !important;
    color:white;
}

#nextBtn{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

    <h1>🇸🇦 كنز السعودية</h1>

    <div class="score">
        النقاط: <span id="score">0</span>
    </div>

    <div class="score" id="timerBox">
        ⏱️ الوقت: <span id="timer">30</span>
    </div>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <button id="nextBtn">
        السؤال التالي
    </button>

</div>

<script>

const questions = [

{
question:"من مؤسس المملكة العربية السعودية؟",
answers:[
{text:"الملك سعود",correct:false},
{text:"الملك عبدالعزيز",correct:true},
{text:"الملك خالد",correct:false},
{text:"الملك فيصل",correct:false}
]
},

{
question:"كم عدد مناطق المملكة العربية السعودية؟",
answers:[
{text:"11",correct:false},
{text:"12",correct:false},
{text:"13",correct:true},
{text:"14",correct:false}
]
},

{
question:"ما عاصمة المملكة العربية السعودية؟",
answers:[
{text:"جدة",correct:false},
{text:"الرياض",correct:true},
{text:"الدمام",correct:false},
{text:"مكة",correct:false}
]
},

{
question:"في أي مدينة تقع الكعبة المشرفة؟",
answers:[
{text:"المدينة",correct:false},
{text:"الرياض",correct:false},
{text:"مكة المكرمة",correct:true},
{text:"الطائف",correct:false}
]
},

{
question:"ما العملة الرسمية للمملكة؟",
answers:[
{text:"الدينار",correct:false},
{text:"الريال",correct:true},
{text:"الدرهم",correct:false},
{text:"الجنيه",correct:false}
]
},

{
question:"ما اسم المنطقة التاريخية المسجلة في اليونسكو قرب الرياض؟",
answers:[
{text:"العلا",correct:false},
{text:"الدرعية",correct:true},
{text:"تبوك",correct:false},
{text:"أبها",correct:false}
]
}

];

let currentQuestion = 0;
let score = 0;

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const scoreEl = document.getElementById("score");
const nextBtn = document.getElementById("nextBtn");

function showQuestion(){

    answersEl.innerHTML = "";

    const q = questions[currentQuestion];

    questionEl.textContent = q.question;

    q.answers.forEach(answer => {

        const button = document.createElement("button");

        button.classList.add("btn");

        button.textContent = answer.text;

        button.addEventListener("click", () => {

            document.querySelectorAll(".btn").forEach(btn => {
                btn.disabled = true;
            });

            if(answer.correct){

                button.classList.add("correct");

                score += 10;

                scoreEl.textContent = score;

            }else{

                button.classList.add("wrong");
            }

        });

        answersEl.appendChild(button);

    });

}

nextBtn.addEventListener("click", () => {

    currentQuestion++;

    if(currentQuestion < questions.length){

        showQuestion();

    }else{

        questionEl.textContent = "🎉 انتهت اللعبة";

        answersEl.innerHTML =
        `<h2>مجموع نقاطك ${score} نقطة</h2>`;

        nextBtn.style.display = "none";
    }

});

showQuestion();

let timeLeft = 30;

const timerEl = document.getElementById("timer");
const timerBox = document.getElementById("timerBox");

const timer = setInterval(() => {

    timeLeft--;

    timerEl.textContent = timeLeft;

    if(timeLeft <= 10){

        timerBox.classList.add("danger");
    }

    if(timeLeft <= 0){

        clearInterval(timer);

        questionEl.textContent = "⏰ انتهى الوقت";

        answersEl.innerHTML =
        `<h2>مجموع نقاطك ${score} نقطة</h2>`;

        nextBtn.style.display = "none";
    }

},1000);

</script>

</body>
</html>
